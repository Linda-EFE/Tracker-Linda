<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Ernährungsplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred phone-width column; a sticky progress header, then one white card per question. */
:root {
  --bg: #EEF2EF;
  --card: #FFFFFF;
  --fg: #1C2723;
  --muted: #5F6E68;
  --line: #DCE4DF;
  --soft: #F4F7F5;
  --accent: #2C7A63;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1F0EA;
  --protein: #2C7A63;
  --carbs: #D49A2A;
  --fat: #6C7FD1;
  --warn: #B54834;
  --warn-soft: #FBEAE5;
  --shadow: 0 1px 2px rgba(28,39,35,.05), 0 8px 24px rgba(28,39,35,.06);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-card: 24px;
  --r-ctl: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --card: #1A2320; --fg: #E7EEEA; --muted: #9AABA4; --line: #2B3833; --soft: #212C28;
    --accent: #5CC4A1; --accent-ink: #0D1F19; --accent-soft: #1F3A31;
    --protein: #5CC4A1; --carbs: #E6B655; --fat: #95A5EC; --warn: #F08A74; --warn-soft: #3A221D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --card: #1A2320; --fg: #E7EEEA; --muted: #9AABA4; --line: #2B3833; --soft: #212C28;
  --accent: #5CC4A1; --accent-ink: #0D1F19; --accent-soft: #1F3A31;
  --protein: #5CC4A1; --carbs: #E6B655; --fat: #95A5EC; --warn: #F08A74; --warn-soft: #3A221D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
.wrap {
  max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 16px 14px;
  display: grid; gap: 10px;
}
.toprow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
.syncpill {
  font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 99px; padding: 4px 10px;
}
.syncpill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sync, var(--line)); }
.syncpill[data-s="saved"] { --sync: var(--accent); }
.syncpill[data-s="saving"], .syncpill[data-s="loading"] { --sync: var(--carbs); }
.syncpill[data-s="error"] { --sync: var(--warn); color: var(--warn); }
.topright { display: flex; align-items: center; gap: 10px; }
.steps-howto { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.steps-howto b { color: var(--fg); }
.stepcount { white-space: nowrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .35s ease; }

.card {
  background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow);
  padding: 24px 20px; display: grid; gap: 18px;
}
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1, h2 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h1 { font-size: 26px; line-height: 1.15; }
h2 { font-size: 19px; line-height: 1.25; }
.q-head { display: grid; gap: 6px; }
.lead { color: var(--muted); margin: 0; }
.explain {
  background: var(--soft); border-radius: var(--r-ctl); padding: 12px 14px;
  font-size: 14px; color: var(--muted); margin: 0;
}
.explain b { color: var(--fg); font-weight: 600; }

.options { display: grid; gap: 10px; }
.opt {
  font: inherit; color: var(--fg); text-align: left; cursor: pointer;
  background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r-ctl);
  padding: 14px 16px; display: grid; gap: 2px; transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt .t { font-weight: 600; }
.opt .s { font-size: 13.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 14.5px; color: var(--fg); cursor: pointer;
  border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 8px 14px;
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.grid4 .opt { text-align: center; padding: 14px 6px; }

.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 13px; color: var(--muted); }
.inputwrap { position: relative; }
input[type="text"], input[type="number"], input[type="password"], input[type="time"], textarea {
  width: 100%; font: inherit; font-size: 18px; color: var(--fg);
  background: var(--soft); border: 1.5px solid var(--line); border-radius: var(--r-ctl);
  padding: 14px 16px; outline: none;
}
textarea { font-size: 16px; min-height: 84px; resize: vertical; }
input:focus, textarea:focus { border-color: var(--accent); background: var(--card); }
.unit { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
input[type="number"] { padding-right: 56px; font-variant-numeric: tabular-nums; }
.error { background: var(--warn-soft); color: var(--warn); border-radius: var(--r-ctl); padding: 10px 14px; font-size: 14px; margin: 0; }

.nav { display: flex; gap: 10px; }
.btn {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: var(--r-ctl);
  padding: 14px 18px; border: 1.5px solid transparent; min-height: 50px; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Result */
.stack { display: grid; gap: 14px; }
.kcal { display: grid; gap: 2px; }
.kcal .num { font-family: var(--f-display); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kcal .num small { font-size: 20px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.split { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 3px; }
.split i { display: block; height: 100%; }
.macros { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.macro { background: var(--soft); border-radius: 16px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
.macro .lbl { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.macro .lbl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.macro .g { font-family: var(--f-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.macro .g small { font-size: 14px; font-weight: 500; color: var(--muted); }
.macro .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.fact { border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.fact .lbl { font-size: 13px; color: var(--muted); }
.fact .v { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.fact .sub { font-size: 12.5px; color: var(--muted); }
.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: tip; }
.tips li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.tips li::before {
  counter-increment: tip; content: counter(tip);
  width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  font-weight: 700; font-size: 14px; display: grid; place-items: center;
}
.tips li span { min-width: 0; }
details.calc { font-size: 14px; color: var(--muted); }
details.calc summary { cursor: pointer; font-weight: 600; color: var(--fg); }
details.calc table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
details.calc td { padding: 6px 0; border-bottom: 1px solid var(--line); }
details.calc td:last-child { text-align: right; color: var(--fg); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* Tracker */
.dayhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dayhead h1 { font-size: 22px; text-align: center; flex: 1; }
.iconbtn { font: inherit; font-size: 20px; line-height: 1; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; flex: none; }
.iconbtn:disabled { opacity: .35; cursor: not-allowed; }
.ringbig { display: grid; place-items: center; }
.ringbig svg { width: 200px; height: 200px; max-width: 100%; }
.rings3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; text-align: center; }
.rings3 svg { width: 84px; height: 84px; max-width: 100%; }
.rings3 .lbl { font-size: 13px; font-weight: 600; }
.rings3 .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
svg text { font-family: var(--f-body); }
.chart svg { width: 100%; height: auto; display: block; }
.meals { list-style: none; margin: 0; padding: 0; display: grid; }
.meal { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.meal:last-child { border-bottom: 0; }
.meal .time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meal .nm { font-weight: 600; overflow-wrap: anywhere; }
.meal .mac { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meal .kc { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.meal .acts { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
.linkbtn { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 2px 4px; cursor: pointer; font-weight: 600; }
.linkbtn.danger { color: var(--warn); }
.empty { color: var(--muted); font-size: 14px; margin: 0; padding: 8px 0; }
.formgrid { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 10px; }
.macgrid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.macgrid input, .formgrid input { font-size: 16px; padding: 12px; }
.macgrid input[type="number"] { padding-right: 12px; }
.macgrid label, .formgrid label { font-size: 13px; }
.review { display: grid; gap: 10px; }
.ai { display: grid; gap: 10px; background: var(--soft); border-radius: 16px; padding: 14px; }
.ai-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ai-row .btn { flex: 1 1 130px; min-height: 46px; padding: 10px 14px; white-space: normal; line-height: 1.25; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.btn-soft { background: var(--accent-soft); color: var(--fg); border-color: var(--accent-soft); }
.btn-soft:hover { border-color: var(--accent); }
.ai textarea { min-height: 60px; font-size: 15px; padding: 10px 12px; }
.ai-photo { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.ai-photo img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; flex: none; }
.ai-result { background: var(--card); border: 1.5px solid var(--accent); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 0; }
.ai-q { background: var(--card); border: 1.5px solid var(--carbs); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.review .facts .v { font-size: 17px; }
@media (max-width: 380px) { .macgrid { grid-template-columns: repeat(2, minmax(0,1fr)); } .formgrid { grid-template-columns: 1fr; } }

.fade { animation: fade .28s ease both; }
@keyframes fade { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } .bar > i { transition: none; } }
@media (max-width: 380px) {
  .grid4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .macros { gap: 6px; } .macro { padding: 10px 8px; } .macro .g { font-size: 22px; }
  .kcal .num { font-size: 48px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="toprow">
      <span class="brand">Dein Ernährungscoach</span>
      <span class="topright"><span class="stepcount" id="stepcount"></span><button type="button" class="syncpill" id="syncbtn" data-s="off">Nur lokal</button></span>
    </div>
    <div class="bar" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="barfill"></i></div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script>
(function () {
  "use strict";
  var STORE_KEY = "ernaehrungscoach-v1";
  var app = document.getElementById("app");
  var barfill = document.getElementById("barfill");
  var bar = document.getElementById("bar");
  var stepcount = document.getElementById("stepcount");

  var state = {
    name: "", age: "", sex: "", height: "", weight: "", goal: "", target: "",
    daily: "", sportFreq: "", sportTypes: "", tempo: "", diet: "",
    avoid: "", health: "", meals: "", weak: [], weakNote: "",
    view: "q", step: 0, plan: null, log: {}
  };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && typeof saved === "object") Object.assign(state, saved);
  } catch (e) {}
  function saveLocal() { state.updatedAt = Date.now(); try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} dirty = true; }
  function save() { saveLocal(); schedulePush(1500); }

  /* ---------- Speichern auf GitHub ---------- */
  var CFG_KEY = "ernaehrungscoach-github";
  var cfg = { token: "", repo: "Linda-EFE/Tracker-Linda-Daten", branch: "main", path: "profil.json" };
  try { var sc = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); if (sc) Object.assign(cfg, sc); } catch (e) {}
  var remoteSha = null, dirty = false, pushTimer = null, pushing = false, showSettings = false, syncMsg = "";
  var syncbtn = document.getElementById("syncbtn");
  function configured() { return !!(cfg.token && cfg.repo && cfg.branch && cfg.path); }
  function setSync(s, msg) {
    var txt = { off: "Nur lokal", loading: "Lädt …", saving: "Speichert …", saved: "Gesichert", error: "Sync-Fehler" }[s];
    syncbtn.setAttribute("data-s", s); syncbtn.textContent = txt; syncMsg = msg || "";
    syncbtn.title = (msg || txt) + " · Einstellungen öffnen";
  }
  function b64enc(str) { var b = new TextEncoder().encode(str), bin = ""; for (var i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]); return btoa(bin); }
  function b64dec(str) { var bin = atob(str.replace(/\s/g, "")), b = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); }
  function api(method, url, body) {
    return fetch("https://api.github.com" + url, {
      method: method, cache: "no-store", keepalive: method === "PUT",
      headers: { Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.text().then(function (t) { var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {} return { status: r.status, data: d }; }); });
  }
  function enc(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  function contentsUrl() { return "/repos/" + cfg.repo + "/contents/" + enc(cfg.path); }
  function errText(r) {
    if (r.status === 401) return "Der Zugangsschlüssel (Token) ist ungültig oder abgelaufen.";
    if (r.status === 403) return "Der Token darf nicht schreiben. Er braucht die Berechtigung „Contents: Read and write“.";
    if (r.status === 404) return "Repository nicht gefunden. Prüfe den Namen und ob der Token Zugriff darauf hat.";
    return "GitHub hat mit Fehler " + r.status + " geantwortet" + (r.data && r.data.message ? ": " + r.data.message : ".");
  }
  var branchOk = false;
  function ensureBranch() {
    if (branchOk) return Promise.resolve(true);
    return api("GET", "/repos/" + cfg.repo + "/branches/" + encodeURIComponent(cfg.branch)).then(function (r) {
      if (r.status === 200) return true;
      if (r.status !== 404) throw r;
      return api("GET", "/repos/" + cfg.repo).then(function (repo) {
        if (repo.status !== 200) throw repo;
        return api("GET", "/repos/" + cfg.repo + "/git/ref/heads/" + encodeURIComponent(repo.data.default_branch));
      }).then(function (ref) {
        if (ref.status !== 200) throw ref;
        return api("POST", "/repos/" + cfg.repo + "/git/refs", { ref: "refs/heads/" + cfg.branch, sha: ref.data.object.sha });
      }).then(function (c) { if (c.status !== 201) throw c; return true; });
    }).then(function (ok) { branchOk = true; return ok; });
  }
  function mergeLog(a, b) {
    var out = {}, days = {};
    Object.keys(a).concat(Object.keys(b)).forEach(function (d) { days[d] = 1; });
    Object.keys(days).sort().forEach(function (d) {
      var byId = {};
      (a[d] || []).concat(b[d] || []).forEach(function (m) {
        var cur = byId[m.id];
        if (!cur || (m.updatedAt || 0) > (cur.updatedAt || 0)) byId[m.id] = m;
      });
      var list = Object.keys(byId).map(function (k) { return byId[k]; });
      list.sort(function (x, y) { return x.time < y.time ? -1 : x.time > y.time ? 1 : (x.id < y.id ? -1 : 1); });
      if (list.length) out[d] = list;
    });
    return out;
  }
  function pull() {
    if (!configured()) { setSync("off"); return Promise.resolve(); }
    setSync("loading");
    return api("GET", contentsUrl() + "?ref=" + encodeURIComponent(cfg.branch)).then(function (r) {
      if (r.status === 404) {
        remoteSha = null;
        return api("GET", "/repos/" + cfg.repo).then(function (repo) {
          if (repo.status !== 200) throw repo;
          return push(true);
        });
      }
      if (r.status !== 200) throw r;
      remoteSha = r.data.sha;
      var remote = JSON.parse(b64dec(r.data.content || ""));
      var rs = (remote && remote.state) || {};
      var merged = mergeLog(state.log || {}, rs.log || {});
      var localNewer = (state.updatedAt || 0) > (rs.updatedAt || 0);
      var remoteNewer = (rs.updatedAt || 0) > (state.updatedAt || 0);
      var logChangedForRemote = JSON.stringify(merged) !== JSON.stringify(rs.log || {});
      var logChangedForLocal = JSON.stringify(merged) !== JSON.stringify(state.log || {});
      if (remoteNewer) { var keepView = state.view; Object.assign(state, rs); if (keepView === "tracker" && state.plan) state.view = "tracker"; }
      state.log = merged;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
      if ((remoteNewer || logChangedForLocal) && !showSettings) { errorMsg = ""; render(); }
      if (localNewer || logChangedForRemote) return push(true);
      dirty = false; setSync("saved");
    }).catch(function (r) { setSync("error", r && r.status ? errText(r) : "Keine Verbindung zu GitHub. Bist du online?"); });
  }
  function schedulePush(ms) {
    if (!configured()) return;
    clearTimeout(pushTimer); pushTimer = setTimeout(function () { push(); }, ms);
  }
  function push(force, retried) {
    if (!configured() || pushing || (!dirty && !force)) return Promise.resolve();
    pushing = true; dirty = false; setSync("saving");
    var body = {
      message: "Ernährungsdaten aktualisiert",

    if (msg) { errorMsg = msg; renderQuestion(); return; }

  /* ---------- Rechnung ---------- */
  function calc() {
    var w = num(state.weight), h = num(state.height), a = num(state.age);
    var female = state.sex === "w";
    var bmr = 10 * w + 6.25 * h - 5 * a + (female ? -161 : 5);
    var base = { sitz: 1.2, beine: 1.375, arbeit: 1.55 }[state.daily] || 1.2;
    var plus = { "0": 0, "1-2": 0.1, "3-4": 0.2, "5+": 0.3 }[state.sportFreq] || 0;
    var factor = Math.min(1.9, base + plus);
    var tdee = bmr * factor;
    var floor = female ? 1200 : 1500;
    var goal = state.goal, tempo = state.tempo || "normal";
    var kcal, weekly = 0, floored = false, note = "";

    if (goal === "ab") {
      var wish = { entspannt: 0.25, normal: 0.5, ehrgeizig: 0.75 }[tempo];
      wish = Math.min(wish, 0.75);
      kcal = tdee - wish * 7700 / 7;
      if (kcal < floor) { kcal = floor; floored = true; }
      kcal = Math.round(kcal / 10) * 10;
      weekly = Math.max(0, Math.min(0.75, (tdee - kcal) * 7 / 7700));
      if (floored && weekly <= 0.05) note = "Dein Bedarf liegt schon nahe am Mindestwert von " + fmt(floor) + " kcal. Weniger zu essen wäre nicht gesund. Mehr Bewegung im Alltag ist hier dein größter Hebel.";
      else if (floored) note = "Ich habe dein Ziel auf den Mindestwert von " + fmt(floor) + " kcal angehoben. Deshalb geht es etwas langsamer als gewünscht.";
    } else if (goal === "muskel") {
      var surplus = { entspannt: 150, normal: 250, ehrgeizig: 400 }[tempo];
      kcal = Math.round((tdee + surplus) / 10) * 10;
      if (kcal < floor) kcal = floor;
      weekly = (kcal - tdee) * 7 / 7700;
    } else {
      kcal = Math.round(tdee / 10) * 10;
      if (kcal < floor) { kcal = floor; note = "Ich habe den Mindestwert von " + fmt(floor) + " kcal angesetzt."; }
      weekly = 0;
    }

    // Eiweiß: 1,6–2 g/kg. Bei hohem BMI rechne ich mit einem angepassten Gewicht (BMI 25), damit die Menge realistisch bleibt.
    var hm = h / 100, bmi = w / (hm * hm);
    var refW = bmi > 30 ? Math.max(25 * hm * hm, num(state.target) || 0) : w;
    refW = Math.min(refW, w);
    var pPerKg = { ab: 1.8, halten: 1.6, muskel: 2.0 }[goal] || 1.6;
    if (state.diet === "eiweiss" || state.diet === "lowcarb") pPerKg = Math.min(2.0, pPerKg + 0.2);
    var protein = Math.round(refW * pPerKg);
    var fatMin = 0.8 * w;
    var fat;
    if (state.diet === "lowcarb") {
      var carbsLC = Math.max(80, Math.round(kcal * 0.2 / 4));
      fat = Math.max(fatMin, (kcal - protein * 4 - carbsLC * 4) / 9);
    } else {
      fat = Math.max(fatMin, kcal * 0.28 / 9);
    }
    fat = Math.round(fat);
    var carbs = Math.round((kcal - protein * 4 - fat * 9) / 4);
    if (carbs < 50) { // Fett aufs Minimum, Eiweiß auf 1,6 g/kg, damit genug Kohlenhydrate bleiben
      fat = Math.round(fatMin);
      protein = Math.round(refW * 1.6);
      carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
    }

    var weeks = null, date = null, diff = null;
    if (goal !== "halten") {
      diff = Math.abs(num(state.target) - w);
      if (weekly > 0.01) {
        weeks = diff / weekly;
        date = new Date(); date.setDate(date.getDate() + Math.round(weeks * 7));
      }
    }
    return { bmr: bmr, factor: factor, tdee: tdee, kcal: kcal, floor: floor, weekly: weekly, protein: protein, fat: fat, carbs: carbs,
      weeks: weeks, date: date, diff: diff, note: note, refW: refW, bmi: bmi, pPerKg: protein / refW };
  }

  function fmtDate(d) { return d ? d.toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" }) : "–"; }

  }

  /* ---------- Tipps ---------- */

    var weak = state.weak;
    if (weak.indexOf("abends") >= 0) out.push("Abends wirst du am ehesten schwach. Plane einen festen Abend-Snack mit etwa 150–200 kcal ein, zum Beispiel " + snack + ". Dann gehört er zum Plan und ist kein Ausrutscher.");
    else if (weak.indexOf("nachts") >= 0) out.push("Spät nachts kommt der Hunger? Iss dein Abendessen eiweißreich und lass dir 150 kcal als Puffer für später, zum Beispiel " + snack + ".");
    else if (weak.indexOf("nachmittags") >= 0) out.push("Gegen das Nachmittagstief hilft ein eiweißreiches Mittagessen und ein geplanter Snack gegen 15 Uhr, zum Beispiel " + snack + ".");

    else if (weak.indexOf("unterwegs") >= 0) out.push("Unterwegs wird es schwierig. Pack dir eine feste Notfall-Option ein, zum Beispiel einen Eiweißriegel oder Obst und Nüsse, dann musst du nicht spontan entscheiden.");
    else if (weak.indexOf("wochenende") >= 0) out.push("Am Wochenende läuft es schwerer. Spar dir unter der Woche täglich etwa 100 kcal auf, dann hast du am Samstag rund 500 kcal Spielraum.");
    else if (weak.indexOf("morgens") >= 0) out.push("Morgens fällt es dir schwer. Ein Frühstück mit mindestens 25 g Eiweiß hält bis mittags satt und spart Heißhunger später.");
    if (veg) out.push("Für " + r.protein + " g Eiweiß am Tag rein pflanzlich: Plane in jede Mahlzeit eine Quelle wie Tofu, Tempeh, Linsen, Kichererbsen oder Sojajoghurt ein.");
    else if (vegi) out.push("Für " + r.protein + " g Eiweiß ohne Fleisch: Magerquark, Skyr, Eier, Hüttenkäse und Linsen sind deine besten Helfer.");
    else if (state.diet === "lowcarb") out.push("Low Carb klappt am besten mit viel Gemüse. Es bringt Ballaststoffe und füllt den Teller, ohne dein Kohlenhydrat-Budget von " + r.carbs + " g zu sprengen.");
    if (state.goal === "muskel" && (state.sportFreq === "0" || state.sportFreq === "1-2")) out.push("Muskeln wachsen vor allem durch Krafttraining. Peile 3 Einheiten pro Woche an, sonst landet das Kalorienplus eher als Fett auf den Hüften.");
    else if (state.sportFreq === "0") out.push("Du musst keinen Sport anfangen, aber jeder Schritt zählt. 7.000 bis 8.000 Schritte am Tag sind ein guter erster Richtwert.");
    else if (state.sportTypes.trim()) out.push("An Tagen mit " + esc(state.sportTypes.trim()) + " darf es etwas mehr Kohlenhydrate geben, am besten 1–2 Stunden vor oder nach dem Training.");
    out.push("Verteile dein Eiweiß auf " + meals + " Mahlzeiten, das sind etwa " + Math.round(r.protein / meals) + " g pro Mahlzeit. So bleibst du länger satt.");
    if (state.avoid.trim()) out.push("Ich lasse " + esc(state.avoid.trim()) + " in allen Vorschlägen weg.");
    out.push("Trink über den Tag verteilt etwa 2 Liter Wasser. Durst fühlt sich oft wie Hunger an.");
    return out.slice(0, 3);
  }

  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();

        var cv = document.createElement("canvas"); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);

    var W = 320, H = 170, top = 22, bottom = 26, left = 4, right = 4;
    var days = [], max = goal * 1.25;
    for (var i = 6; i >= 0; i--) { var k = shiftDay(endKey, -i), t = totals(k).kcal; days.push({ k: k, v: t }); if (t > max) max = t; }
    var ch = H - top - bottom, slot = (W - left - right) / 7, bw = Math.min(26, slot * 0.56);
    function y(v) { return top + ch - (v / max) * ch; }
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Kalorien der letzten 7 Tage">';
    out += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + (top + ch) + '" y2="' + (top + ch) + '" stroke="var(--line)" stroke-width="1"></line>';
    days.forEach(function (d, i) {
      var x = left + slot * i + (slot - bw) / 2, h = (d.v / max) * ch, sel = d.k === selDay;
      var fill = d.v > goal * 1.1 ? "var(--carbs)" : sel ? "var(--accent)" : "var(--accent-soft)";
      if (d.v > 0) out += '<rect x="' + x.toFixed(1) + '" y="' + y(d.v).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 2).toFixed(1) + '" rx="5" fill="' + fill + '"></rect>';
      if (d.v > 0) out += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y(d.v) - 5).toFixed(1) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + fmt(d.v) + "</text>";
      out += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11.5" font-weight="' + (sel ? 700 : 500) + '" fill="' + (sel ? "var(--fg)" : "var(--muted)") + '">' + WD[parseDay(d.k).getDay()] + "</text>";
    });
    out += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + y(goal).toFixed(1) + '" y2="' + y(goal).toFixed(1) + '" stroke="var(--fg)" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 4"></line>';
    out += '<text x="' + (W - right) + '" y="' + (y(goal) - 5).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--muted)">Ziel ' + fmt(goal) + "</text>";
    return out + "</svg>";
  }

  function weekReview(endKey) {
    var P = state.plan, logged = 0, inTarget = 0, sumK = 0, sumP = 0;
    for (var i = 0; i < 7; i++) {
      var k = shiftDay(endKey, -i), t = totals(k);
      if (meals(k).length) { logged++; sumK += t.kcal; sumP += t.p; if (Math.abs(t.kcal - P.kcal) <= P.kcal * 0.1) inTarget++; }
    }
    var avgK = logged ? sumK / logged : 0, avgP = logged ? sumP / logged : 0, tip;
    if (logged < 4) tip = "Trag nächste Woche an mindestens 5 Tagen alles ein. Erst dann ist die Auswertung aussagekräftig.";
    else if (avgK > P.kcal * 1.1) tip = "Du lagst im Schnitt " + fmt(avgK - P.kcal) + " kcal über dem Ziel. Such dir die eine Mahlzeit oder den einen Snack, der am meisten ausmacht, und halbiere ihn.";
    else if (avgP < P.protein * 0.85) tip = "Beim Eiweiß fehlen dir im Schnitt " + fmt(P.protein - avgP) + " g. Plane nächste Woche zu jeder Mahlzeit eine feste Eiweißquelle ein.";
    else if (avgK < P.kcal * 0.85) tip = "Du hast deutlich weniger gegessen als geplant. Das klingt gut, macht aber auf Dauer Heißhunger. Iss nächste Woche näher an deinem Ziel.";
    else tip = "Starke Woche. Bleib genau so dran und wieg dich einmal pro Woche zur gleichen Zeit.";
    return '<section class="card fade review"><div class="q-head"><span class="eyebrow">Sonntag · Wochenrückblick</span><h2>Deine letzten 7 Tage</h2></div>' +
      '<div class="facts">' +
        '<div class="fact"><span class="lbl">Ø Kalorien</span><span class="v">' + (logged ? fmt(avgK) + " kcal" : "–") + '</span><span class="sub">Ziel ' + fmt(P.kcal) + "</span></div>" +
        '<div class="fact"><span class="lbl">Ø Eiweiß</span><span class="v">' + (logged ? fmt(avgP) + " g" : "–") + '</span><span class="sub">Ziel ' + P.protein + " g</span></div>" +
        '<div class="fact"><span class="lbl">Tage eingetragen</span><span class="v">' + logged + ' von 7</span><span class="sub">&nbsp;</span></div>' +
        '<div class="fact"><span class="lbl">Tage im Ziel</span><span class="v">' + inTarget + '</span><span class="sub">± 10 % der Kalorien</span></div>' +
      "</div>" +
      '<p class="explain"><b>Deine Anpassung für nächste Woche:</b> ' + esc(tip) + "</p></section>";
  }

  function saveMeal() {
    var name = (draft.name || "").trim(), time = draft.time || nowTime();
    var p = num(draft.p) || 0, c = num(draft.c) || 0, f = num(draft.f) || 0, k = num(draft.kcal);
    if (!name) { mealError = "Bitte gib an, was du gegessen hast."; renderTracker(); return; }
    if (!(k >= 0)) k = Math.round(p * 4 + c * 4 + f * 9);
    if (!(k > 0)) { mealError = "Bitte gib die Kalorien an, oder Eiweiß, Kohlenhydrate und Fett. Dann rechne ich die Kalorien aus."; renderTracker(); return; }
    var list = state.log[selDay] = (state.log[selDay] || []);
    var entry = { id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6)), time: time, name: name, kcal: Math.round(k), p: Math.round(p), c: Math.round(c), f: Math.round(f), updatedAt: Date.now() };
    var at = -1; list.forEach(function (m, i) { if (m.id === entry.id) at = i; });
    if (at >= 0) list[at] = entry; else list.push(entry);
    list.sort(function (x, y) { return x.time < y.time ? -1 : x.time > y.time ? 1 : 0; });
    editingId = null; draft = {}; mealError = ""; resetAi();
    save(); renderTracker();
  }

  function renderTracker() {
    var P = state.plan;
    if (!P) { state.view = "result"; render(); return; }
    setProgress(1, 1, "Tracker");
    var today = dayKey(new Date()), t = totals(selDay), list = meals(selDay);
    var rest = P.kcal - t.kcal;
    var center = '<text x="100" y="94" text-anchor="middle" font-size="38" font-weight="700" fill="var(--fg)" style="font-family:var(--f-display)">' + fmt(Math.abs(rest)) + "</text>" +
      '<text x="100" y="120" text-anchor="middle" font-size="14" fill="var(--muted)">' + (rest >= 0 ? "kcal übrig" : "kcal drüber") + "</text>" +
      '<text x="100" y="142" text-anchor="middle" font-size="12" fill="var(--muted)">' + fmt(t.kcal) + " / " + fmt(P.kcal) + "</text>";
    function small(lbl, v, goal, color) {
      return "<div>" + ring(84, 9, v, goal, color, '<text x="42" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="var(--fg)">' + Math.round(v) + "</text>") +
        '<div class="lbl">' + lbl + '</div><div class="sub">von ' + goal + " g</div></div>";
    }
    var isSunday = parseDay(selDay).getDay() === 0;
    var d = draft;
    app.innerHTML =
      '<section class="card fade">' +
        '<div class="dayhead"><button type="button" class="iconbtn" id="day-prev" aria-label="Vorheriger Tag">‹</button><h1>' + dayTitle(selDay) + '</h1>' +
          '<button type="button" class="iconbtn" id="day-next" aria-label="Nächster Tag"' + (selDay >= today ? " disabled" : "") + ">›</button></div>" +
        '<div class="ringbig">' + ring(200, 16, t.kcal, P.kcal, "var(--accent)", center) + "</div>" +
        '<div class="rings3">' + small("Eiweiß", t.p, P.protein, "var(--protein)") + small("Kohlenh.", t.c, P.carbs, "var(--carbs)") + small("Fett", t.f, P.fat, "var(--fat)") + "</div>" +
      "</section>" +
      (isSunday ? weekReview(selDay) : "") +
      '<section class="card fade"><div class="q-head"><span class="eyebrow">Tagebuch</span><h2>' + (list.length ? list.length + (list.length === 1 ? " Mahlzeit" : " Mahlzeiten") : "Noch nichts eingetragen") + "</h2></div>" +
        (list.length ? '<ul class="meals">' + list.map(function (m) {
          return '<li class="meal"><span class="time">' + esc(m.time) + '</span><div><div class="nm">' + esc(m.name) + '</div><div class="mac">E ' + m.p + " g · K " + m.c + " g · F " + m.f + " g</div></div>" +
            '<div><div class="kc">' + fmt(m.kcal) + ' kcal</div><div class="acts">' +
              (selDay !== today ? '<button type="button" class="linkbtn" data-meal="' + esc(m.id) + '" data-act="again">Heute nochmal</button>' : "") +
              '<button type="button" class="linkbtn" data-meal="' + esc(m.id) + '" data-act="edit">Ändern</button>' +
              '<button type="button" class="linkbtn danger" data-meal="' + esc(m.id) + '" data-act="del">Löschen</button></div></div></li>';
        }).join("") + "</ul>" : '<p class="empty">Trag unten deine erste Mahlzeit für diesen Tag ein.</p>') +
      "</section>" +
      '<form class="card fade" id="mealform" novalidate><div class="q-head"><span class="eyebrow">' + (editingId ? "Eintrag ändern" : "Mahlzeit eintragen") + "</span><h2>" + (editingId ? "Was soll ich korrigieren?" : "Was hast du gegessen?") + "</h2></div>" +
        aiBlock() +
        '<div class="formgrid"><div class="field"><label for="m-time">Uhrzeit</label><input id="m-time" data-draft="time" type="time" value="' + esc(d.time || (selDay === today ? nowTime() : "12:00")) + '"></div>' +
          '<div class="field"><label for="m-name">Mahlzeit</label><input id="m-name" data-draft="name" type="text" autocomplete="off" placeholder="z. B. Haferflocken mit Beeren" value="' + esc(d.name || "") + '"></div></div>' +
        '<div class="macgrid">' +
          '<div class="field"><label for="m-kcal">kcal</label><input id="m-kcal" data-draft="kcal" type="number" inputmode="numeric" min="0" value="' + esc(d.kcal == null ? "" : d.kcal) + '"></div>' +
          '<div class="field"><label for="m-p">Eiweiß g</label><input id="m-p" data-draft="p" type="number" inputmode="decimal" min="0" value="' + esc(d.p == null ? "" : d.p) + '"></div>' +
          '<div class="field"><label for="m-c">Kohlenh. g</label><input id="m-c" data-draft="c" type="number" inputmode="decimal" min="0" value="' + esc(d.c == null ? "" : d.c) + '"></div>' +
          '<div class="field"><label for="m-f">Fett g</label><input id="m-f" data-draft="f" type="number" inputmode="decimal" min="0" value="' + esc(d.f == null ? "" : d.f) + '"></div>' +
        "</div>" +
        '<p class="note">Lässt du die Kalorien leer, rechne ich sie aus Eiweiß, Kohlenhydraten und Fett aus.</p>' +
        (mealError ? '<p class="error" role="alert">' + esc(mealError) + "</p>" : "") +
        '<div class="nav">' + (editingId ? '<button type="button" class="btn btn-ghost" id="meal-cancel">Abbrechen</button>' : "") +
          '<button type="submit" class="btn btn-primary">' + (editingId ? "Änderung speichern" : "Eintragen") + "</button></div>" +
      "</form>" +
      '<section class="card fade"><div class="q-head"><span class="eyebrow">Verlauf</span><h2>Kalorien der letzten 7 Tage</h2></div><div class="chart">' + weekChart(selDay, P.kcal) + "</div>" +
        (isSunday ? "" : '<p class="note">Sonntags siehst du hier oben deinen Wochenrückblick mit einer Anpassung für die nächste Woche.</p>') + "</section>" +
      '<div class="nav"><button type="button" class="btn btn-ghost" id="toresult" style="flex:1">Mein Plan</button><button type="button" class="btn btn-ghost" id="edit" style="flex:1">Antworten ändern</button></div>' +
      '<button type="button" class="btn btn-ghost" id="open-settings" style="width:100%">Einstellungen (GitHub &amp; Claude-Schlüssel)</button>';
  }

  function render() {
    if (showSettings) renderSettings();
    else if (state.view === "result") renderResult();
    else if (state.view === "tracker" || state.view === "done") { if (state.view === "done") state.view = "tracker"; renderTracker(); }
    else renderQuestion();
  }
  render();
  pull();
})();
</script>
</body>
</html>
